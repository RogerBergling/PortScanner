name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - windows-build
    paths:
      - ".github/workflows/windows-build.yml"
      - "packaging/**"
      - "requirements-build.txt"
      - "requirements-dev.txt"
      - "src/**"
      - "tests/**"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PortScanner.exe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          architecture: x64

      - name: Show toolchain
        run: |
          python -VV
          python -m pip --version

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Audit dependencies
        run: python -m pip_audit -r requirements-build.txt -r requirements-dev.txt --strict

      - name: Show Python and Tk versions
        run: >
          python -c "import sys, tkinter; print(sys.version);
          print('Tk', tkinter.TkVersion);
          print('Tcl', tkinter.Tcl().eval('info patchlevel'))"

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build GUI executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name PortScanner
          --paths src
          --specpath build
          packaging/windows_launcher.py

      - name: Build CLI executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --console
          --name PortScannerCLI
          --paths src
          --specpath build
          packaging/windows_cli_launcher.py

      - name: Verify and checksum executables
        shell: pwsh
        run: |
          foreach ($name in @("PortScanner.exe", "PortScannerCLI.exe")) {
            $path = Join-Path "dist" $name
            if (-not (Test-Path $path)) {
              throw "PyInstaller did not produce $path"
            }
            Get-Item $path | Format-List Name, Length
          }

          $guiHash = (Get-FileHash dist/PortScanner.exe -Algorithm SHA256).Hash.ToLower()
          $cliHash = (Get-FileHash dist/PortScannerCLI.exe -Algorithm SHA256).Hash.ToLower()
          $lines = @(
            "$guiHash  PortScanner.exe",
            "$cliHash  PortScannerCLI.exe"
          )
          $lines | Set-Content dist/SHA256SUMS
          Get-Content dist/SHA256SUMS

      - name: Smoke test executables
        shell: pwsh
        run: |
          foreach ($name in @("PortScanner.exe", "PortScannerCLI.exe")) {
            $process = Start-Process -FilePath (Join-Path "dist" $name) `
              -ArgumentList "--version" -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "$name --version exited with $($process.ExitCode)"
            }
          }

      - name: Upload executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PortScanner-windows-x64
          path: |
            dist/PortScanner.exe
            dist/PortScannerCLI.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
